name: 'CI'

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run ShellCheck with -x flag
        run: shellcheck -x cac_setup.sh tests/setup.sh

  nss:
    name: Browser database setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Exercise browser databases and module registration
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3-tools opensc-pkcs11 zip unzip
          bash tests/setup.sh
